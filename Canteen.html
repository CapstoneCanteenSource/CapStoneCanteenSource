     <style>


        body {
            margin: 0;
            background-color: #0b1d3a;
            font-family: sans-serif;
            color: #ffffff;
        }

       
        .topnav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color:lightblue;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 12px;
            z-index: 1000;
            border-bottom: 2px solid #1a2f54;

        }

        .topnav img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
        }

        .topnav span {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

    
        .botnav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: lightblue;
            backdrop-filter: blur(5px);
            overflow: hidden;
            display: flex;
            justify-content: space-around;
            padding: 5px 20px;
            z-index: 1000;
        }

        .botnav a {
            color: #000;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .botnav a:hover {
            background-color: #ffffff;
            color: #000;
            border-radius: 8px;
        }
    
    </style>
</head>
